<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cartera360{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
        }

        /* Header */
        header {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #38bdf8;
            text-decoration: none;
        }

        .logo span {
            color: #fbbf24;
        }

        nav a {
            color: #cbd5e1;
            text-decoration: none;
            margin-left: 1.5rem;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        nav a:hover {
            color: #38bdf8;
        }

        /* Main container */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Page title */
        h1 {
            font-size: 2rem;
            color: #f8fafc;
            margin-bottom: 1rem;
        }

        h2 {
            font-size: 1.5rem;
            color: #f8fafc;
            margin-bottom: 1rem;
        }

        /* Cards */
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* Form styles */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            color: #cbd5e1;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 0.5rem;
            color: #f8fafc;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: #38bdf8;
        }

        .form-control::file-selector-button {
            background: #38bdf8;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            color: #0f172a;
            font-weight: 600;
            cursor: pointer;
            margin-right: 0.75rem;
        }

        .form-control::file-selector-button:hover {
            background: #7dd3fc;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 0.5rem;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #38bdf8;
            color: #0f172a;
        }

        .btn-primary:hover {
            background: #7dd3fc;
        }

        .btn-secondary {
            background: #475569;
            color: #f8fafc;
        }

        .btn-secondary:hover {
            background: #64748b;
        }

        .btn-block {
            width: 100%;
        }

        /* Alerts */
        .alert {
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .alert-error {
            background: #7f1d1d;
            border: 1px solid #991b1b;
            color: #fecaca;
        }

        .alert-success {
            background: #14532d;
            border: 1px solid #16a34a;
            color: #bbf7d0;
        }

        .alert-info {
            background: #1e3a8a;
            border: 1px solid #2563eb;
            color: #bfdbfe;
        }

        /* Table container */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
        }

        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid #334155;
        }

        th {
            background: #0f172a;
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.875rem;
            text-transform: uppercase;
        }

        tr:hover {
            background: #334155;
        }

        /* Footer */
        footer {
            background: #0f172a;
            border-top: 1px solid #334155;
            padding: 1.5rem 2rem;
            color: #94a3b8;
            font-size: 0.875rem;
            margin-top: 3rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            main {
                padding: 1rem;
            }

            header {
                padding: 1rem;
                flex-direction: column;
                gap: 1rem;
            }

            nav a {
                margin-left: 0;
                margin-right: 1rem;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header>
        <a href="{{ url_for('main.index') }}" class="logo">Cartera<span>360</span></a>
        <nav>
            <a href="{{ url_for('main.index') }}">Inicio</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>Cartera360 - Análisis de Antigüedad de Cuentas por Cobrar &copy; 2026</p>
        <p>Usuarios: Encargado de Cuentas por Cobrar, Encargado de Ruta, Jefe Financiero</p>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
